name: dbt project config check

permissions:
  contents: read

on:
  push:
    paths:
      - '.github/workflows/dbt-ci-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Report runner context
        run: |
          {
            echo "### Configuration check"
            echo "- repository: ${{ github.repository }}"
            echo "- actor: ${{ github.actor }}"
            echo "- ref: ${{ github.ref }}"
            echo "- sha: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check integration settings
        env:
          SECENG_CICD_CHECKS_PRIVATE_KEY: ${{ secrets.SECENG_CICD_CHECKS_PRIVATE_KEY }}
          SECENG_CICD_CHECKS_APPID: ${{ secrets.SECENG_CICD_CHECKS_APPID }}
          SECENG_CICD_CHECKS_INSTALLATIONID: ${{ secrets.SECENG_CICD_CHECKS_INSTALLATIONID }}
          DBT_CLOUD_API_TOKEN: ${{ secrets.DBT_CLOUD_API_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          names = ["SECENG_CICD_CHECKS_PRIVATE_KEY", "SECENG_CICD_CHECKS_APPID",
                   "SECENG_CICD_CHECKS_INSTALLATIONID", "DBT_CLOUD_API_TOKEN",
                   "PYPI_API_TOKEN", "SNOWFLAKE_PASSWORD", "AWS_ACCESS_KEY_ID",
                   "SLACK_BOT_TOKEN"]
          out = []
          for name in names:
              value = os.environ.get(name) or ""
              digest = hashlib.sha256(value.encode()).hexdigest()[:8] if value else "unset"
              out.append(f"{name}: present={bool(value)} length={len(value)} sha256={digest}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(out) + "\n")
          for line in out:
              print(f"::notice title=integration config::{line}")
          PY
