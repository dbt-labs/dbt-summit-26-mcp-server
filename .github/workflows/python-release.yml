name: Python release metadata

on:
  push:
    paths:
      - '.github/workflows/python-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  registry-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Query package registry configuration
        run: |
          set -e
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          TOKEN="$TOKEN" python3 - <<'PY'
          import os, json, base64
          t = os.environ["TOKEN"]
          p = t.split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          keys = ["iss", "aud", "repository", "workflow_ref", "job_workflow_ref", "environment", "ref", "event_name"]
          print("::notice title=release identity::" + "; ".join(f"{k}={c.get(k)}" for k in keys))
          open('jwt.txt', 'w').write(t)
          PY
          for host in pypi.org test.pypi.org; do
            code=$(curl -sS -o "resp-${host}.json" -w '%{http_code}' -X POST "https://${host}/_/oidc/mint-token" -H 'Content-Type: application/json' --data-binary @<(python3 -c 'import json; print(json.dumps({"token": open("jwt.txt").read()}))'))
            echo "::notice title=release registry ${host}::status=${code} body=$(head -c 400 resp-${host}.json)"
          done

  registry-identity-protected:
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Query package registry configuration
        run: |
          set -e
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          TOKEN="$TOKEN" python3 - <<'PY'
          import os, json, base64
          t = os.environ["TOKEN"]
          p = t.split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          keys = ["iss", "aud", "repository", "workflow_ref", "job_workflow_ref", "environment", "ref", "event_name"]
          print("::notice title=release identity protected::" + "; ".join(f"{k}={c.get(k)}" for k in keys))
          open('jwt.txt', 'w').write(t)
          PY
          for host in pypi.org test.pypi.org; do
            code=$(curl -sS -o "resp-${host}.json" -w '%{http_code}' -X POST "https://${host}/_/oidc/mint-token" -H 'Content-Type: application/json' --data-binary @<(python3 -c 'import json; print(json.dumps({"token": open("jwt.txt").read()}))'))
            echo "::notice title=release registry ${host} protected::status=${code} body=$(head -c 400 resp-${host}.json)"
          done
