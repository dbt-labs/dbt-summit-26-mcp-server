version: 2

models:
  - name: MRT_US_CITY_TEMPERATURES
    description: Monthly temperature history for 35 U.S. cities, exposed for city-level climate analysis at one row per calendar month from January 1948 through November 2022. Temperature columns are measured in degrees Celsius.
    semantic_model:
      enabled: true
    agg_time_dimension: time
    derived_semantics:
      entities:
        - name: temperature_observation
          type: primary
          expr: time
    metrics:
      - name: average_albuquerque_temperature
        label: Average Albuquerque Temperature
        description: Average monthly temperature in degrees Celsius for Albuquerque, New Mexico.
        type: simple
        agg: average
        expr: albuquerque
      - name: average_anchorage_temperature
        label: Average Anchorage Temperature
        description: Average monthly temperature in degrees Celsius for Anchorage, Alaska.
        type: simple
        agg: average
